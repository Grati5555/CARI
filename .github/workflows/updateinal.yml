name: Auto Update & Clean IPTV

on:
  schedule:
    # Otomatis berjalan setiap 6 jam sekali (bisa disesuaikan)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Tombol untuk menjalankan manual di tab Actions

jobs:
  run-cleaner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run inalFilter script
        run: python inalFilter.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add active_playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update active_playlist.m3u using inalFilter.py" && git push)
